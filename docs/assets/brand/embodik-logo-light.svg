<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img" aria-labelledby="title desc">
  <title id="title">EmbodiK logo</title>
  <desc id="desc">A rounded light card with the EmbodiK C-shaped mark, blue policy bar, and three connected robot nodes.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1b34" flood-opacity="0.16"/>
    </filter>
    <pattern id="dot-grid" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#2f67f4" opacity="0.18"/>
    </pattern>
    <radialGradient id="dot-fade" cx="0.76" cy="0.74" r="0.46">
      <stop offset="0" stop-color="#2f67f4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2f67f4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="400" height="220" rx="22" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="240" y="140" width="142" height="68" fill="url(#dot-fade)"/>
  <path d="M248 196c40-18 88-22 130-11" fill="none" stroke="url(#dot-grid)" stroke-width="62" opacity="0.75"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 58a62 62 0 1 0 0 124" stroke="#07172f" stroke-width="15"/>
    <path d="M148 120h58" stroke="#2d65f2" stroke-width="18"/>
    <path d="M218 120c33 0 40-47 77-47" stroke="#5d83ef" stroke-width="5"/>
    <path d="M218 120h76" stroke="#2d65f2" stroke-width="5"/>
    <path d="M218 120c33 0 41 47 79 47" stroke="#5d83ef" stroke-width="5"/>
    <path d="M294 73h19" stroke="#07172f" stroke-width="5"/>
    <path d="M296 167h17" stroke="#07172f" stroke-width="5"/>
  </g>
  <circle cx="207" cy="120" r="5.5" fill="#2d65f2"/>
  <circle cx="315" cy="73" r="10" fill="#07172f"/>
  <circle cx="300" cy="120" r="10" fill="#2d65f2"/>
  <circle cx="315" cy="167" r="10" fill="#07172f"/>
</svg>
