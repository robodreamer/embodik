<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">EmbodiK logo</title>
  <desc id="desc">A rounded dark square with the EmbodiK C-shaped mark, blue policy bar, and three connected robot nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#142743"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#071426" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="216" height="216" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 63a52 52 0 1 0 0 106" stroke="#ffffff" stroke-width="12"/>
    <path d="M109 120h38" stroke="#4c73ff" stroke-width="14"/>
    <path d="M156 120c21 0 26-30 50-30" stroke="#4c73ff" stroke-width="4"/>
    <path d="M156 120h49" stroke="#4c73ff" stroke-width="4"/>
    <path d="M156 120c21 0 26 30 50 30" stroke="#4c73ff" stroke-width="4"/>
    <path d="M205 90h11" stroke="#ffffff" stroke-width="4"/>
    <path d="M206 150h10" stroke="#ffffff" stroke-width="4"/>
  </g>
  <circle cx="148" cy="120" r="4.5" fill="#4c73ff"/>
  <circle cx="216" cy="90" r="7" fill="#ffffff"/>
  <circle cx="207" cy="120" r="7" fill="#4c73ff"/>
  <circle cx="216" cy="150" r="7" fill="#ffffff"/>
</svg>
