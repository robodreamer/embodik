[workspace]
name = "embodik"
version = "0.20.18"
description = "High-performance inverse kinematics solver optimized for cross-embodiment VLA/AI applications"
authors = ["Andy Park <andypark.purdue@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"

[dependencies]
# Build tools (explicitly listed for faster builds, though scikit-build-core can auto-detect)
cmake = ">=3.16,<4"
ninja = ">=1.12,<2"
# C++ dependencies
eigen = ">=3.4.0,<4"
pinocchio = ">=3.8.0,<4" # Required for built-in ViserVisualizer
# Python build dependencies
python = ">=3.10,<3.13"
nanobind = ">=2.8.0,<3"
scikit-build-core = ">=0.11.5,<0.12"
pip = ">=25.1,<26"
qhull = ">=2020.2,<2021"
qhull-static = ">=2020.2,<2021"

[pypi-dependencies]
numpy = ">=1.26.0"
# Visualization dependencies (needed for examples)
viser = ">=0.1.0"
trimesh = ">=3.0.0"
robot_descriptions = ">=1.0.0"
scipy = ">=1.11.0"
# YAML parsing for robot presets
pyyaml = ">=6.0"
# Publishing tools
build = ">=1.0.0"
twine = ">=5.0.0"
# Testing and development tools (available in default environment)
pytest = ">=7.0"
pytest-benchmark = ">=4.0"
black = ">=24.0"
isort = ">=5.13.0"
mkdocs-material = "*"
mkdocstrings = { extras = ["python"], version = "*" }
# GPU acceleration dependencies
casadi = ">=3.6.0"
warp-lang = ">=1.0.0"
fast-simplification = ">=0.1.13, <0.2"

[tasks]
# Patch Qhull CMake config before building (workaround for conda-forge qhull package)
patch-qhull = "python scripts/patch_qhull_cmake.py"
clean-dist = "bash -lc 'shopt -s nullglob; rm -f dist/*.tar.gz dist/*.whl'"
# Development install with automatic rebuild on import (2025 best practice)
install = { cmd = "python -m pip install -e . --no-build-isolation", depends-on = [
    "patch-qhull",
] }
install-rebuild = { cmd = "python -m pip install -C editable.rebuild=true -e . --no-build-isolation", depends-on = [
    "patch-qhull",
] }
build = { cmd = "python -m pip install --no-build-isolation .", depends-on = [
    "patch-qhull",
] }
test = "python -m pytest test/"
test-verbose = "python -m pytest test/ -v"
test-native = { cmd = "bash -lc 'cmake -S . -B build/native-tests -G Ninja -DBUILD_TESTS=ON -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=\"$CONDA_PREFIX\" -Dpinocchio_DIR=\"$CONDA_PREFIX/lib/cmake/pinocchio\" -DEigen3_DIR=\"$CONDA_PREFIX/share/eigen3/cmake\" -DCMAKE_EXE_LINKER_FLAGS=\"-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib\" && cmake --build build/native-tests --parallel 2 && ctest --test-dir build/native-tests --output-on-failure --parallel 2 -R \"^(test_robot_model|test_hierarchical_linear_solver|test_acceleration_task_differential|test_velocity_collision_linearization|test_generalized_constraint_set|test_acceleration_state_box|test_acceleration_solver|test_acceleration_solver_affine_constraints|test_acceleration_solver_task_bounds|test_acceleration_solver_frozen_locks|test_acceleration_allocation_transform|test_acceleration_solver_allocation|test_acceleration_solver_effort|test_acceleration_solver_contact|test_acceleration_solver_tight_point|test_acceleration_solver_tight_frame_pose|test_acceleration_solver_relative_pose|test_acceleration_solver_torso_pose_bounds|test_acceleration_solver_com_support_polygon|test_geometric_constraint_differential|test_shared_constraint_definitions)$\"'", depends-on = [
    "patch-qhull",
] }
test-spot-ik = "python -m pytest test/test_spot_whole_body_ik_headless.py -v"
verify-agent = "python scripts/verify_changed.py --run"
verify-ai-worker = "python scripts/verify_ai_worker_robustness.py --scenario all --output-json /tmp/ai_worker_metrics.json"
# GPU solver tests (requires CUDA)
test-gpu = "EMBODIK_GPU_TESTS=1 pytest test/test_gpu_solver.py test/test_gpu_collision.py -v"
# GPU benchmarks
benchmark-gpu = "python examples/gpu_batch_ik.py --batch_sizes 10 100 500 1000"
benchmark-gpu-batched = "python scripts/benchmark_gpu_batched.py"
benchmark-fi-pesns = "python scripts/benchmark_fi_pesns.py"
benchmark-collision = "python examples/gpu_collision_batch.py"
benchmark-transforms = "python scripts/benchmark_transforms.py"
# Parallel trajectory demo (real FK/Jacobians via pytorch_kinematics)
demo-parallel-tracking = "python examples/parallel_trajectory_tracking.py --n-robots 100 --viz-mode hybrid --n-viz-full 9 --spacing 1.2"
demo-parallel-tracking-benchmark = "python examples/parallel_trajectory_tracking.py --n-robots 1000 --benchmark"
# Export CasADi function for GPU solver
export-casadi = "python -m embodik.gpu.export_casadi_velocity_solve --robot panda --out build/casadi/fn_velocity_solve.casadi"
lint = "black --check --extend-exclude '\\.pyi$' python/ test/ && isort --check --skip-glob '*.pyi' python/ test/"
format = "black --extend-exclude '\\.pyi$' python/ test/ && isort --skip-glob '*.pyi' python/ test/"
docs-build = { cmd = "python -W ignore::DeprecationWarning:hppfcl -m mkdocs build", depends-on = ["install"] }
docs-serve = "mkdocs serve"
# Build distributions
build-wheel = { cmd = "python -m build --wheel", depends-on = ["clean-dist", "patch-qhull"] }
build-sdist = { cmd = "python -m build --sdist", depends-on = ["clean-dist", "patch-qhull"] }
build-dist = { cmd = "python -m build", depends-on = ["clean-dist", "patch-qhull"] }
# Setup PyPI credentials (run once to create ~/.pypirc)
setup-pypirc = "bash scripts/setup_pypirc.sh"
# Upload helpers. Production PyPI sdist-only upload is recovery-gated in the script.
upload-testpypi = "bash scripts/upload_testpypi.sh"
upload-pypi = "bash scripts/upload_pypi.sh"
# Version management
version = "python scripts/version.py"

[feature.dev.dependencies]
# Additional dev-only dependencies
pytest-cov = ">=2.0"

[feature.dev.tasks]
test-cov = "pytest test/ --cov=embodik --cov-report=term-missing"

# Teleop feature: Xvisio SDK for Seer controller (requires libxvsdk.so on host)
[feature.teleop.pypi-dependencies]
xvisio = ">=0.3.1"

[feature.teleop.tasks]
demo-teleop = "python examples/03_teleop_ik.py --robot panda --enable-teleop"
demo-bimanual-teleop = "python examples/06_bimanual_whole_body_ik.py --robot rby1"

# Optional mjviser/MuJoCo stack for Spot locomanipulation.
[feature.mjviser.pypi-dependencies]
mjviser = ">=0.0.14"
mujoco = ">=3.6.0,<3.9"
onnxruntime = ">=1.18,<2"

[feature.mjviser.tasks]
spot-locomanip-mjviser = { cmd = "python examples/09_spot_locomanip_mjviser.py", depends-on = [
    "install",
] }
test-spot-locomanip = { cmd = "python -m pytest test/test_spot_locomanip_mjviser.py -v", depends-on = [
    "install",
] }

# CUDA feature for GPU acceleration
[feature.cuda]
# CUDA feature needs pytorch channel first to get CUDA build
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "strict"

[feature.cuda.target.linux-64.dependencies]
# CUDA-enabled PyTorch from pytorch channel (linux only)
pytorch = { version = ">=2.0", channel = "pytorch" }
pytorch-cuda = { version = ">=12.1", channel = "pytorch" }

[feature.cuda.tasks]
# Install CusADi from GitHub (run once)
install-cusadi = "bash scripts/install_cusadi.sh"
check-cuda = "python -c \"import torch; print(f'PyTorch {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}' if torch.cuda.is_available() else 'No CUDA')\""
check-gpu = "python -c \"from embodik.gpu import HAS_CASADI, HAS_CUSADI, HAS_TORCH_CUDA; print(f'CasADi: {HAS_CASADI}, CusADi: {HAS_CUSADI}, CUDA: {HAS_TORCH_CUDA}')\""
test-gpu = "EMBODIK_GPU_TESTS=1 pytest test/test_gpu_solver.py test/test_gpu_collision.py -v"
benchmark-gpu = "python examples/gpu_batch_ik.py --batch_sizes 10 100 500 1000"
benchmark-collision = "python examples/gpu_collision_batch.py"
export-casadi = "python -m embodik.gpu.export_casadi_velocity_solve --robot panda --out build/casadi/fn_velocity_solve.casadi"
demo-gpu = "python examples/gpu_solver_demo.py --batch_sizes 10 100 500 1000 2000"
demo-ik-gpu = "python examples/02_collision_aware_IK.py --robot panda --gpu"
# Compare FI-PeSNS vs PPH-SNS solvers
benchmark-solver-comparison = "python scripts/benchmark_pph_sns_comparison.py --problems 10 --runs 50"
benchmark-solver-batched = "python scripts/benchmark_pph_sns_batched.py"
# Export PPH-SNS solver for GPU compilation
export-pph-sns = "python scripts/export_pph_sns.py"

[environments]
# Default environment includes dev features for development
default = { features = ["dev"], solve-group = "default" }
# Teleop environment for Seer controller examples (run: pixi run -e teleop demo-teleop)
teleop = { features = ["dev", "teleop"], solve-group = "teleop" }
# Optional Spot locomanipulation mjviser example (run: pixi run -e mjviser spot-locomanip-mjviser)
mjviser = { features = ["dev", "mjviser"], solve-group = "mjviser" }
# Optional locomanipulation environment with Seer/xvisio teleop enabled.
mjviser-teleop = { features = ["dev", "mjviser", "teleop"], solve-group = "mjviser-teleop" }
# CUDA environment for GPU acceleration
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }
