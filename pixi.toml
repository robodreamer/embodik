[project]
name = "embodik"
version = "0.2.0"
description = "High-performance inverse kinematics solver optimized for cross-embodiment VLA/AI applications"
authors = ["Andy Park <andypark.purdue@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig"

[dependencies]
# Build tools (explicitly listed for faster builds, though scikit-build-core can auto-detect)
cmake = ">=3.16,<4"
ninja = ">=1.12,<2"
# C++ dependencies
eigen = ">=3.4.0,<4"
pinocchio = ">=3.8.0,<4" # Required for built-in ViserVisualizer
# Python build dependencies
python = ">=3.10,<3.13"
nanobind = ">=2.8.0,<3"
scikit-build-core = ">=0.11.5,<0.12"
pip = ">=25.1,<26"
qhull = ">=2020.2,<2021"
qhull-static = ">=2020.2,<2021"

[pypi-dependencies]
numpy = ">=1.26.0"
# Visualization dependencies (needed for examples)
viser = ">=0.1.0"
trimesh = ">=3.0.0"
robot_descriptions = ">=1.0.0"
scipy = ">=1.11.0"
# YAML parsing for robot presets
pyyaml = ">=6.0"
# Xvisio SDK for Seer controller support in teleop examples
xvisio = ">=0.3.1"
# Publishing tools
build = ">=1.0.0"
twine = ">=5.0.0"
# Testing and development tools (available in default environment)
pytest = ">=7.0"
pytest-benchmark = ">=4.0"
black = ">=24.0"
isort = ">=5.13.0"
mkdocs-material = "*"
mkdocstrings = { extras = ["python"], version = "*" }
# GPU acceleration dependencies
casadi = ">=3.6.0"
warp-lang = ">=1.0.0"

[tasks]
# Patch Qhull CMake config before building (workaround for conda-forge qhull package)
patch-qhull = "python scripts/patch_qhull_cmake.py"
# Development install with automatic rebuild on import (2025 best practice)
install = { cmd = "pip install -e . --no-build-isolation", depends-on = [
    "patch-qhull",
] }
install-rebuild = { cmd = "pip install -C editable.rebuild=true -e . --no-build-isolation", depends-on = [
    "patch-qhull",
] }
build = { cmd = "pip install --no-build-isolation .", depends-on = [
    "patch-qhull",
] }
test = "pytest test/"
test-verbose = "pytest test/ -v"
# GPU solver tests (requires CUDA)
test-gpu = "EMBODIK_GPU_TESTS=1 pytest test/test_gpu_solver.py test/test_gpu_collision.py -v"
# GPU benchmarks
benchmark-gpu = "python examples/04_gpu_batch_ik.py --batch_sizes 10 100 500 1000"
benchmark-gpu-batched = "python scripts/benchmark_gpu_batched.py"
benchmark-fi-pesns = "python scripts/benchmark_fi_pesns.py"
benchmark-collision = "python examples/05_gpu_collision_batch.py"
# Export CasADi function for GPU solver
export-casadi = "python -m embodik.gpu.export_casadi_velocity_solve --robot panda --out fn_velocity_solve.casadi"
lint = "black --check python/ test/ && isort --check python/ test/"
format = "black python/ test/ && isort python/ test/"
docs-build = "python -W ignore::DeprecationWarning:hppfcl -m mkdocs build"
docs-serve = "mkdocs serve"
# Build distributions
build-wheel = { cmd = "python -m build --wheel", depends-on = ["patch-qhull"] }
build-sdist = { cmd = "python -m build --sdist", depends-on = ["patch-qhull"] }
build-dist = { cmd = "python -m build", depends-on = ["patch-qhull"] }
# Setup PyPI credentials (run once to create ~/.pypirc)
setup-pypirc = "bash scripts/setup_pypirc.sh"
# Upload to PyPI (requires credentials configured in ~/.pypirc)
upload-testpypi = "bash scripts/upload_testpypi.sh"
upload-pypi = "bash scripts/upload_pypi.sh"
# Version management
version = "python scripts/version.py"

[feature.dev.dependencies]
# Additional dev-only dependencies
pytest-cov = ">=2.0"

[feature.dev.tasks]
test-cov = "pytest test/ --cov=embodik --cov-report=term-missing"

# CUDA feature for GPU acceleration
[feature.cuda]
# CUDA feature needs pytorch channel first to get CUDA build
channels = ["pytorch", "nvidia", "conda-forge"]
channel-priority = "strict"

[feature.cuda.target.linux-64.dependencies]
# CUDA-enabled PyTorch from pytorch channel (linux only)
pytorch = { version = ">=2.0", channel = "pytorch" }
pytorch-cuda = { version = ">=12.1", channel = "pytorch" }

[feature.cuda.tasks]
# Install CusADi from GitHub (run once)
install-cusadi = "bash scripts/install_cusadi.sh"
check-cuda = "python -c \"import torch; print(f'PyTorch {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}' if torch.cuda.is_available() else 'No CUDA')\""
check-gpu = "python -c \"from embodik.gpu import HAS_CASADI, HAS_CUSADI, HAS_TORCH_CUDA; print(f'CasADi: {HAS_CASADI}, CusADi: {HAS_CUSADI}, CUDA: {HAS_TORCH_CUDA}')\""
test-gpu = "EMBODIK_GPU_TESTS=1 pytest test/test_gpu_solver.py test/test_gpu_collision.py -v"
benchmark-gpu = "python examples/04_gpu_batch_ik.py --batch_sizes 10 100 500 1000"
benchmark-collision = "python examples/05_gpu_collision_batch.py"
export-casadi = "python -m embodik.gpu.export_casadi_velocity_solve --robot panda --out fn_velocity_solve.casadi"
demo-gpu = "python examples/06_gpu_solver_demo.py --batch_sizes 10 100 500 1000 2000"
demo-ik-gpu = "python examples/02_collision_aware_IK.py --robot panda --gpu"
benchmark-fi-pesns = "python scripts/benchmark_fi_pesns.py"

[environments]
# Default environment includes dev features for development
default = { features = ["dev"], solve-group = "default" }
# CUDA environment for GPU acceleration
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }
