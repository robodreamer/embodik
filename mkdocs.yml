site_name: EmbodiK Documentation
site_description: High-performance inverse kinematics solver optimized for cross-embodiment VLA/AI applications
site_url: https://robodreamer.github.io/embodik/
repo_url: https://github.com/robodreamer/embodik
repo_name: robodreamer/embodik
edit_uri: edit/main/docs/

# Ensure proper URL handling - use directory URLs (transforms/ instead of transforms.html)
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  copyright: Copyright &copy; 2026 Andy Park
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            separate_signature: true
            line_length: 100
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Get Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - Guides:
    - Working with Transforms: transforms.md
    - GPU Solvers: gpu_solvers.md
  - Examples:
    - Overview: examples/index.md
    - Core IK:
      - Basic IK: examples/basic_ik.md
      - Multi-Task Multi-Constraints IK: examples/multi_task_ik.md
      - Collision-Aware IK: examples/collision_aware_ik.md
      - CoM Constraint: examples/com_constraint_ik.md
      - Dual-Arm ECTS: examples/dual_arm_ects.md
      - Teleop IK: examples/teleop_ik.md
    - Robots:
      - Bimanual Whole-Body IK: examples/bimanual_whole_body_ik.md
      - Unitree G1 Retargeting IK: examples/unitree_g1_retargeting_ik.md
    - GPU & Batch:
      - GPU Batch IK: examples/gpu_batch_ik.md
      - GPU Collision Batch: examples/gpu_collision_batch.md
      - GPU Solver Demo: examples/gpu_solver_demo.md
      - Parallel Trajectory Tracking: examples/parallel_trajectory_tracking.md
    - Utilities:
      - Robot Model Usage: examples/robot_model_usage.md
      - Visualization: examples/visualization_examples.md
  - API Reference:
    - Overview: api/index.md
    - RobotModel: api/robot_model.md
    - KinematicsSolver: api/kinematics_solver.md
    - Tasks: api/tasks.md
    - Transforms: api/transforms.md
    - Utilities: api/utils.md
    - Visualization: api/visualization.md
  - Development: development.md
  - Third-Party Notices: third_party_notices.md
  - Changelog: changelog.md
