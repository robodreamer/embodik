[build-system]
# Build isolation only installs build-system requirements. We include `pin` here so that
# source builds (sdists) can still locate Pinocchio's CMake package config via the PyPI wheel.
# Published repaired wheels bundle/repair native Pinocchio dependencies and do not need
# Python `pin` at runtime. Source/no-build-isolation installs still need the native
# provider used at build time (`pin` or a system Pinocchio install) to remain available.
requires = [
    "scikit-build-core",
    "nanobind",
    "pin>=3.8.0,<4",
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2>=10,<11",
]
build-backend = "scikit_build_core.build"

[project]
name = "embodik"
version = "0.21.0"
description = "High-performance inverse kinematics solver optimized for cross-embodiment VLA/AI applications"
authors = [{ name = "Andy Park", email = "andypark.purdue@gmail.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/*.txt"]
requires-python = ">=3.10,<3.13"
# Core repaired wheels only need NumPy at Python runtime. Source installs may still
# require a native Pinocchio provider (`pin` or system libs) at import time.
dependencies = ["numpy>=1.26.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["robotics", "inverse-kinematics", "optimization", "motion-planning"]

[project.scripts]
embodik-sanitize-env = "embodik.cli:sanitize_env"
embodik-examples = "embodik.cli:examples_cmd"

[project.optional-dependencies]
visualization = [
    "viser>=0.1.0",     # Direct Viser visualization server
    "pyliblzfse>=0.4.1; sys_platform != 'win32'", # Compressed ViserUrdf meshes
    "trimesh>=3.0.0",   # Mesh loading for robot visualization
    "yourdfpy>=0.0.52", # URDF parsing for direct Viser visualization
]
visualization-legacy = [
    "viser>=0.1.0",
    "yourdfpy>=0.0.52", # Only needed for legacy custom visualization
    # Note: spatialmath-python removed - now using Pinocchio's native transforms
]
# Pinocchio-based visualization (alternative to direct Viser)
visualization-pinocchio = [
    "pin>=3.8.0,<4",  # Pinocchio Python bindings
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2>=10,<11",
    "viser>=0.1.0",
    "trimesh>=3.0.0",
]
# Example scripts copied via `embodik-examples` import these directly.
examples = [
    "pin>=3.8.0,<4",
    "cmeel-urdfdom>=4,<5",
    "cmeel-tinyxml2>=10,<11",
    "pycollada>=0.8",
    "pyyaml>=6.0",
    "robot_descriptions>=1.0.0",
    "trimesh>=3.0.0",
    "viser>=0.1.0",
    "pyliblzfse>=0.4.1; sys_platform != 'win32'",
    "yourdfpy>=0.0.52",
]
mjviser = [
    "mjviser>=0.0.14",
    "mujoco>=3.6.0,<3.9",
    "onnxruntime>=1.18,<2",
    "robot_descriptions>=1.0.0",
    "viser>=1.0.24",
]
teleop = [
    "xvisio>=0.3.1",
]
# GPU acceleration via CusADi (requires CUDA + manual cusadi installation)
gpu = [
    "casadi>=3.6.0",
    "torch>=2.0.0",
    # Note: cusadi must be installed manually from https://github.com/se-hwan/cusadi
]
# GPU collision detection via NVIDIA Warp
gpu-collision = ["warp-lang>=1.0.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=24.0", "isort>=5.13.0"]

[project.urls]
Homepage = "https://github.com/robodreamer/embodik"
Repository = "https://github.com/robodreamer/embodik"
Documentation = "https://robodreamer.github.io/embodik/"
"Bug Reports" = "https://github.com/robodreamer/embodik/issues"

[tool.scikit-build]
# Keep wheel and editable CMake caches separate across Python ABIs and build modes.
build-dir = "build/{state}-{cache_tag}"

[tool.scikit-build.sdist]
# Keep source distributions focused on build/runtime inputs. Documentation,
# preview media, and tests are published from the repository/docs site instead
# of being bundled into every PyPI source upload.
exclude = [
    ".github/**",
    "examples/harnesses/**",
    "docs/**",
    "site/**",
    "test/**",
    "pixi.lock",
]

[tool.scikit-build.cmake]
source-dir = "."

[tool.scikit-build.wheel]
# Install the Python package - CMake installs go here
install-dir = "embodik"
# Include Python packages from source
packages = ["python/embodik"]

[tool.scikit-build.ninja]
# Explicitly use Ninja generator (required when ninja is available)
make-fallback = false

[tool.scikit-build.editable]
# Use redirect mode so editable installs can rebuild native extension modules
# without relying on stale in-source artifacts.
mode = "redirect"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
BUILD_EXAMPLES = "OFF"       # Examples are Python scripts, not C++ builds
BUILD_TESTS = "OFF"          # Tests should be built separately, not during pip install

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["embodik", "examples"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')",
]
filterwarnings = ["ignore::DeprecationWarning:hppfcl"]

[tool.cibuildwheel]
build = "cp3{10,11,12}-*"
skip = ["*-musllinux_*", "*-win32", "*-win_amd64", "*-manylinux_i686"]
test-command = "python -c \"import embodik; print(embodik.__version__)\""
build-verbosity = 1

[tool.cibuildwheel.linux]
# Keep Linux wheels on hosted x86_64 runners. The aarch64 path currently forces
# source builds of cmeel dependencies under emulation and is not release-stable.
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-build = "python -m pip install scikit-build-core nanobind ninja 'pin>=3.8.0,<4' 'cmeel-urdfdom>=4,<5' 'cmeel-tinyxml2>=10,<11'"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-all = "if command -v dnf >/dev/null 2>&1; then dnf install -y eigen3-devel urdfdom-devel urdfdom-headers-devel; elif command -v yum >/dev/null 2>&1; then yum install -y eigen3-devel urdfdom-devel urdfdom-headers-devel; elif command -v microdnf >/dev/null 2>&1; then microdnf install -y eigen3-devel urdfdom-devel urdfdom-headers-devel; else echo 'No supported package manager found for build dependencies' >&2; exit 1; fi"
repair-wheel-command = "bash scripts/auditwheel_with_pin_libs.sh {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Default Homebrew `eigen` can be Eigen 5.x; EmbodiK requires Eigen 3.x (find_package Eigen3 3.3).
before-all = "brew install eigen@3 urdfdom_headers urdfdom"
# Also install Pinocchio in cibuildwheel's build environment so the repair step
# can locate PyPI/cmeel dylibs that are linked through @rpath.
before-build = "python -m pip install 'pin>=3.8.0,<4' 'cmeel-urdfdom>=4,<5' 'cmeel-tinyxml2>=10,<11'"
# Pin wheel prefix is prepended by CMakeLists.txt; Homebrew prefix helps find urdfdom_headers.
# cmeel octomap/qhull dylibs currently require macOS 14+, so tag the wheel accordingly.
environment = { Eigen3_DIR = "/opt/homebrew/opt/eigen@3/share/eigen3/cmake", CMAKE_PREFIX_PATH = "/opt/homebrew", MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_OSX_DEPLOYMENT_TARGET = "14.0" }
repair-wheel-command = "bash scripts/delocate_with_pin_libs.sh {dest_dir} {wheel}"
