name: CI

on:
  push:
    branches: [ main, packaging-and-docs ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ main, packaging-and-docs ]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Build and install package
        run: pixi run install

      - name: Run native solver tests
        run: pixi run test-native

      - name: Run tests
        run: pixi run test

      - name: Check code formatting
        run: pixi run lint
