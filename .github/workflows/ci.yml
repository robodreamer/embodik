name: CI

on:
  push:
    branches: [ main, packaging-and-docs ]
  pull_request:
    branches: [ main, packaging-and-docs ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Build and install package
        run: pixi run install

      - name: Run tests
        run: pixi run test
        continue-on-error: true

      - name: Check code formatting
        run: pixi run lint
        continue-on-error: true

  test-linux-pip-source:
    name: Linux pip source install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and smoke test source install
        run: |
          bash scripts/install_embodik_linux.sh \
            --venv .venv \
            --python python \
            --editable "$PWD" \
            --clean-env

  test-macos-arm64:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install package (venv + pip)
        run: |
          bash scripts/install_embodik_macos.sh \
            --venv .venv \
            --python python \
            --editable "$PWD" \
            --clean-env
          source .venv/bin/activate
          python -m pip install pytest pytest-benchmark robot_descriptions casadi trimesh pycollada

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest test/

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Build and install package
        run: pixi run install

      - name: Build documentation
        run: pixi run python -W ignore::DeprecationWarning:hppfcl -m mkdocs build --strict
